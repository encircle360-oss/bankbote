spring:
  application:
    name: bankbote

# Bankbote listens on the loopback address only: the Hibiscus Server next to it in the same
# network namespace notifies it, nothing else needs to reach it. See docs/sicherheit.md.
server:
  address: 127.0.0.1
  port: 8089
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      # The probe port of bankbote.probes.* serves these two groups and nothing else. They show
      # only their status; a group without an include would take every component, the last run
      # among them, and a failed run would then restart the pod.
      group:
        liveness:
          include: livenessState
          show-components: never
          show-details: never
        readiness:
          include: readinessState
          show-components: never
          show-details: never
  health:
    diskspace:
      enabled: false
  info:
    env:
      enabled: false

bankbote:
  lookback-days: 14
  time-zone: Europe/Berlin
  schedule: "0 0 * * * *"
  notify-delay: 60s
