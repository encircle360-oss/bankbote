version: 2

# zizmor is pinned twice, in requirements-dev.txt and as a pre-commit hook. One pull request for
# both ecosystems moves them together.
multi-ecosystem-groups:
  development-tools:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A week gives a compromised release time to be noticed and pulled before it lands here.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    labels: []

  # The plugins of build.gradle.kts, the libraries outside the Spring Boot BOM and the Gradle
  # wrapper; the BOM pins everything else.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: []

  # Both FROM of the Containerfile, by tag and digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # GraalVM follows the Java version of the build; a new major version is a decision.
      - dependency-name: graalvm/native-image-community
        update-types: ['version-update:semver-major']
    labels: []

  # The images of the integration tests, by tag and digest.
  - package-ecosystem: docker
    directory: /src/integrationTest/images
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The database follows what the image of Hibiscus Server is tested with; a new major version is
      # a decision.
      - dependency-name: mariadb
        update-types: ['version-update:semver-major']
    labels: []

  - package-ecosystem: pip
    directory: /
    multi-ecosystem-group: development-tools
    patterns: ['*']
    cooldown:
      default-days: 7
    labels: []

  - package-ecosystem: pre-commit
    directory: /
    multi-ecosystem-group: development-tools
    patterns: ['*']
    cooldown:
      default-days: 7
    ignore:
      # shellcheck-py tagged v0.11.0.1-1 a year after v0.11.0.1. Dependabot reads the suffix as a
      # pre-release and proposes the older tag as an update.
      - dependency-name: https://github.com/shellcheck-py/shellcheck-py
        versions: ['0.11.0.1']
    labels: []
