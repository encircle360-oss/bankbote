name: Integration

# The suites of src/integrationTest run Bankbote against real servers in containers, with the images
# of src/integrationTest/images/Dockerfile. The Hibiscus suite starts Hibiscus Server with MariaDB in
# about a minute and runs on every pull request; the weekly run notices a change of the pinned images
# or of the runner between pull requests.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  hibiscus:
    name: Hibiscus Server (real server, MariaDB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run the Hibiscus suite
        run: ./gradlew --no-daemon hibiscusTest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hibiscus-test-reports
          path: build/reports/tests/hibiscusTest
          if-no-files-found: ignore
          retention-days: 14
