name: Integration ERPNext

# The ERPNext suite of src/integrationTest runs Bankbote against a real ERPNext 16 and the whole
# chain from a real Hibiscus Server into it. Its image is large and a new site takes minutes, so pull
# requests run it only when they touch what talks to ERPNext or the suite itself. Every push to main
# and a weekly run keep it from rotting; a failed weekly run opens or updates an issue.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - src/main/java/com/encircle360/oss/bankbote/erpnext/**
      - src/main/java/com/encircle360/oss/bankbote/delivery/**
      - src/main/java/com/encircle360/oss/bankbote/config/**
      - src/integrationTest/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
      - .github/workflows/integration-erpnext.yml
  schedule:
    - cron: '23 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-erpnext-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  erpnext:
    name: ERPNext 16 (real site) and the whole chain
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run the ERPNext suite
        run: ./gradlew --no-daemon erpnextTest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: erpnext-test-reports
          path: build/reports/tests/erpnextTest
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: Report a failed weekly run
    needs: erpnext
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # open or comment on the issue of the failed run
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Integrationstest ERPNext fehlgeschlagen"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          body="Der wöchentliche Lauf der ERPNext-Suite ist fehlgeschlagen: $RUN"
          if [[ -n $number ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
