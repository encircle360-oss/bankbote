name: Image

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - .dockerignore
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradle/**
      - src/main/**
      - .github/scripts/smoke-test.sh
      - .github/workflows/image.yml
  pull_request:
    paths:
      - Containerfile
      - .dockerignore
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradle/**
      - src/main/**
      - .github/scripts/smoke-test.sh
      - .github/workflows/image.yml
  workflow_dispatch:
  # release.yml builds, tests and publishes a release with this workflow.
  workflow_call:
    inputs:
      publish:
        description: Whether to push the images and name them under the tags of the release
        type: boolean
        default: false
    outputs:
      tags:
        description: The image tags the release was pushed with, separated by commas
        value: ${{ jobs.publish.outputs.tags }}

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/encircle360-oss/bankbote
  LOCAL_TAG: bankbote:ci

jobs:
  build:
    name: Build and smoke test (${{ matrix.arch }})
    # A native image is built for the platform it runs on; each platform builds on a runner of its
    # own, without emulation.
    strategy:
      fail-fast: ${{ inputs.publish == true }}
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push the image by digest, only when publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git describe needs the tags for the version label.
          fetch-depth: 0
          persist-credentials: false

      - name: Plan the build
        id: plan
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            version=$GITHUB_REF_NAME
          else
            version=$(git describe --tags --always --dirty)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version $version"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the GitHub Container Registry
        if: inputs.publish == true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build the native image and the container
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.plan.outputs.version }}
            REVISION=${{ github.sha }}
          # The provenance comes from the attestation of the pushed image.
          provenance: false
          # The engine and the registry get the image from this one build; a pull request pushes
          # nothing.
          outputs: |
            type=docker,name=${{ env.LOCAL_TAG }}
            ${{ inputs.publish == true && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '' }}

      - name: Start the hardened image from a mounted configuration and check health, probe port and start check
        run: .github/scripts/smoke-test.sh "$LOCAL_TAG"

      - name: Keep the digest for the job publish
        if: inputs.publish == true
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/${PLATFORM//\//-}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.publish == true
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Create the SBOM
        if: inputs.publish == true
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.LOCAL_TAG }}
          format: spdx-json
          artifact-name: bankbote-${{ matrix.arch }}.spdx.json
          upload-release-assets: false

  publish:
    name: Publish the image
    needs: build
    if: inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push the index under the tags
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Plan the image tags
        id: tags
        run: |
          if [[ ! $GITHUB_REF_NAME =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not a release tag vX.Y.Z."
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          echo "tags=$IMAGE:$version,$IMAGE:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Push one index for both platforms under the tags
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          digests=()
          for platform in linux-amd64 linux-arm64; do
            digests+=("$IMAGE@$(cat "$RUNNER_TEMP/digests/$platform")")
          done
          tag_args=()
          IFS=, read -ra tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done
          docker buildx imagetools create "${tag_args[@]}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/encircle360-oss/bankbote" \
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            "${digests[@]}"
          manifest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${tags[0]}")
          for digest in "$(jq --raw-output .digest <<< "$manifest")" "${digests[@]#"$IMAGE@"}"; do
            printf '%s  %s\n' "${digest#sha256:}" "$IMAGE"
          done > "$RUNNER_TEMP/attestation-subjects"

      - name: Attest the build provenance of the index and both images
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/attestation-subjects
